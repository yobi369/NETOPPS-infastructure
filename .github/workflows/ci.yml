name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netopps-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@660965736c4aecc62797ea07d351a3c259f14660 # immutable upstream commit (2026-10-12)
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q netopps tests
      - name: Parse JSON schema and example
        run: |
          python -m json.tool schemas/inventory.schema.json > /dev/null
          python -m json.tool examples/inventory.json > /dev/null
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Lint Python source
        run: ruff check netopps tests
      - name: Static security analysis
        run: bandit -q -r netopps
      - name: Scan repository for secrets
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.ruff_cache|htmlcov|dist|build)/' > /tmp/netopps-secrets.json
          python -c 'import json, sys; results = json.load(open("/tmp/netopps-secrets.json", encoding="utf-8")).get("results", {}); findings = [(path, entries) for path, entries in results.items() if entries]; print(f"Secret scan findings: {sum(len(entries) for _, entries in findings)}"); [print(path, len(entries)) for path, entries in findings]; sys.exit(bool(findings))'
      - name: Audit installed Python dependencies
        run: pip-audit --skip-editable
      - name: Build wheel and install artifact
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Run unit tests with coverage
        run: |
          coverage run --branch --source=netopps -m unittest discover -s tests -v
          coverage report --fail-under=80
      - name: Validate example inventory through module
        run: python -m netopps validate examples/inventory.json
      - name: Validate example inventory through installed command
        run: cd /tmp && netopps validate "$GITHUB_WORKSPACE/examples/inventory.json"
