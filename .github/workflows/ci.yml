name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q netopps tests
      - name: Parse JSON schema and example
        run: |
          python -m json.tool schemas/inventory.schema.json > /dev/null
          python -m json.tool examples/inventory.json > /dev/null
      - name: Install package
        run: python -m pip install ".[test]"
      - name: Lint Python source
        run: ruff check netopps tests
      - name: Static security analysis
        run: bandit -q -r netopps
      - name: Run unit tests with coverage
        run: |
          coverage run --branch --source=netopps -m unittest discover -s tests -v
          coverage report --fail-under=80
      - name: Validate example inventory through module
        run: python -m netopps validate examples/inventory.json
      - name: Validate example inventory through installed command
        run: netopps validate examples/inventory.json
